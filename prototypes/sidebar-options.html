<style>

*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:hover{background:var(--raised)}button,input,select{border-radius:6px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}::selection{background:var(--selected);color:var(--text)}input{caret-color:var(--accent)}input::placeholder{color:var(--muted)}svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}a{color:var(--accent);text-underline-offset:3px}.muted{color:var(--muted)}.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:8px}.icon{width:30px;height:30px;display:inline-grid;place-items:center;color:var(--muted);flex:none}.badge{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--raised);color:var(--muted);font-variant-numeric:tabular-nums}.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}.working{color:var(--green)}.working .dot,.dot.working{background:var(--green)}.blocked{color:var(--amber)}.blocked .dot,.dot.blocked{background:var(--amber)}.done{color:var(--accent)}.done .dot{background:var(--accent)}
.lab{max-width:1600px;margin:auto;padding:25px 28px 0}.lab-head{display:flex;align-items:center;gap:16px;margin-bottom:21px}.lab-head h1{font-size:23px;letter-spacing:-.025em;font-weight:600;margin:0}.lab-head p{margin:3px 0 0;color:var(--muted)}.lab-controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.options{display:flex;gap:4px;padding:4px;background:var(--chrome);border:1px solid var(--line);border-radius:9px}.options button{padding:8px 15px;color:var(--muted)}.options button[aria-pressed=true]{background:var(--raised);color:var(--text)}.options small{margin-right:7px;color:var(--muted)}.control{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.control select{background:var(--chrome);border:1px solid var(--line);padding:7px}.theme{margin-left:auto;border:1px solid var(--line);padding:7px 12px;display:flex;align-items:center;gap:7px}.viewport{overflow:auto;margin-top:20px;border:1px solid var(--line);border-radius:12px}.app{width:100%;min-width:980px;height:660px;background:var(--bg);display:grid;grid-template-columns:252px minmax(0,1fr);overflow:hidden}.app.rail{grid-template-columns:276px minmax(0,1fr)}.app.focus{grid-template-columns:236px minmax(0,1fr)}.sidebar{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}.sidebar-head{height:52px;padding:0 14px;display:flex;align-items:center;gap:7px;flex:none}.traffic{display:flex;gap:6px;margin-right:10px}.traffic i{width:10px;height:10px;background:#ef6a62;border-radius:50%}.traffic i:nth-child(2){background:#e9bd55}.traffic i:nth-child(3){background:#63bf71}.brand{font-size:13px;font-weight:600}.sidebar-content{padding:0 10px;overflow:auto;flex:1}.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;margin:8px 2px 20px;padding:6px 9px;color:var(--muted)}.search input{width:100%;min-width:0;border:0;background:transparent;outline-offset:6px;font-size:12px}.search svg{width:14px}.section-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;color:var(--muted);margin:19px 7px 7px}.section-label .icon{width:23px;height:23px}.space-row{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:9px 8px;min-height:40px}.space-row[aria-current=true],.agent-row[aria-current=true]{background:var(--selected)}.avatar{width:26px;height:26px;display:grid;place-items:center;font-size:11px;font-weight:600;border-radius:6px;background:var(--raised);color:var(--muted);flex:none}.space-row[aria-current=true] .avatar{background:var(--accent);color:var(--bg)}.space-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.space-meta{font-size:11px;color:var(--muted);display:block}.nested{padding:3px 0 8px 30px}.agent-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;min-height:41px;padding:7px 9px;color:var(--text)}.agent-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;display:block}.agent-meta{font-size:11px;color:var(--muted);display:block}.agent-row .status-label{font-size:10px}.agent-row svg{width:14px;color:var(--muted)}.sidebar-footer{padding:12px 15px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center;flex:none}.footer-settings{margin-left:auto}.attention{margin:5px 2px 18px;padding:9px 10px;background:var(--raised);display:flex;gap:9px;align-items:center;width:calc(100% - 4px);text-align:left;font-size:12px}.attention .grow small{display:block;color:var(--muted);font-size:11px}.rail-body{display:flex;flex:1;min-height:0}.space-rail{width:52px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:7px 4px;gap:8px}.space-rail button{position:relative;width:39px;height:38px;display:grid;place-items:center}.space-rail button[aria-current=true]{background:var(--selected)}.space-rail .dot{position:absolute;right:3px;bottom:3px;border:2px solid var(--chrome);width:9px;height:9px}.rail-detail{padding:0 9px;min-width:0;flex:1;overflow:auto}.context-head{padding:10px 7px 16px}.context-head strong{font-size:14px}.context-head small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.context-head small svg{width:12px;height:12px}.divider{height:1px;background:var(--line);margin:16px 4px}.scope-tabs{display:flex;border-bottom:1px solid var(--line);margin:8px 5px 13px;gap:15px}.scope-tabs button{padding:6px 0 9px;border-radius:0;color:var(--muted);font-size:12px}.scope-tabs button[aria-pressed=true]{border-bottom:1px solid var(--accent);color:var(--text)}.focus-picker{margin:7px 2px 12px;position:relative}.focus-picker summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:10px 8px;background:var(--raised);border-radius:7px}.focus-picker summary::-webkit-details-marker{display:none}.picker-list{position:absolute;top:100%;left:0;right:0;z-index:4;background:var(--chrome);border:1px solid var(--line);border-radius:7px;padding:5px;box-shadow:0 8px 24px #0004}.focus .agent-row{min-height:52px}.focus .agent-row .status-label{display:block}.quiet-note{margin:20px 9px;color:var(--muted);font-size:11px;line-height:1.7}.new-agent{display:flex;align-items:center;justify-content:center;gap:7px;width:calc(100% - 12px);margin:16px 6px;padding:8px;border:1px solid var(--line);font-size:12px}.empty{font-size:12px;color:var(--muted);padding:15px 9px}.work{display:flex;flex-direction:column;min-width:0;min-height:0}.work-tabs{height:43px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 13px;font-size:12px;color:var(--muted);flex:none}.work-tab{align-self:stretch;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--accent);color:var(--text);padding:0 7px}.work-body{display:grid;grid-template-columns:minmax(0,1fr) 308px;gap:8px;padding:8px;flex:1;min-height:0}.pane{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;overflow:hidden;display:flex;flex-direction:column}.pane-head{height:34px;border-bottom:1px solid var(--line);padding:0 11px;display:flex;align-items:center;gap:8px;font-size:11px;flex:none}.terminal-content{padding:25px 23px;overflow:auto;flex:1;font:12px/1.9 var(--mono);color:var(--muted)}.terminal-content h2{font:600 14px/1.5 var(--mono);color:var(--text);margin:0 0 22px}.terminal-content p{margin:0 0 22px}.terminal-content .output{padding:10px 0 10px 14px;border-left:1px solid var(--line);margin:15px 0 26px}.terminal-content code{font:inherit;color:var(--text)}.terminal-content .check{color:var(--green)}.prompt{padding:13px 15px;margin:10px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:12px var(--mono)}.terminal-model{padding:0 14px 11px;font:10px var(--mono);color:var(--muted)}.git-head{padding:14px 13px 10px;font-size:12px;font-weight:600}.git-tabs{padding:0 12px 10px;display:flex;gap:13px;color:var(--muted);border-bottom:1px solid var(--line);font-size:11px}.git-tabs span:first-child{color:var(--text)}.branch{padding:12px;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}.branch svg{width:13px}.file-group{padding:13px 13px 8px;font-size:11px;color:var(--muted)}.file-row{display:flex;align-items:center;gap:8px;padding:7px 13px;font-size:11px}.file-row .letter{color:var(--amber);font-size:10px}.file-row .letter.added{color:var(--green)}.git-blank{flex:1;min-height:16px}.commit{margin:12px;border:1px solid var(--line);padding:10px;border-radius:6px;color:var(--muted);font-size:11px;min-height:64px}.commit-buttons{padding:0 12px 14px;display:flex;gap:7px}.demo-control{border:1px solid var(--line);padding:6px 11px;font-size:11px;border-radius:5px;background:var(--raised)}.app-status{height:27px;display:flex;gap:12px;align-items:center;padding:0 12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);flex:none}.caption{display:flex;gap:40px;align-items:flex-start;padding:20px 1px 28px}.caption h2{font-size:16px;letter-spacing:-.015em;margin:0 0 5px;font-weight:600}.caption p{color:var(--muted);max-width:72ch;font-size:12px;margin:0;line-height:1.7}.tradeoff{max-width:320px;margin-left:auto}.tradeoff strong{font-size:11px;font-weight:500;display:block;margin-bottom:5px}.demo-label{font-size:11px;color:var(--muted);margin:0 0 24px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 17px;border-radius:7px;background:var(--text);color:var(--bg);font-size:12px;max-width:90vw;z-index:10}.toast:empty{display:none}@media(min-width:1600px){.app{height:730px}.work-body{grid-template-columns:minmax(0,1fr) 360px}}@media(max-width:720px){.lab{padding:18px 14px 0}.lab-head{align-items:start}.lab-head h1{font-size:21px}.lab-head p{font-size:12px}.lab-controls{gap:10px}.options{width:100%}.options button{padding:8px 10px;flex:1;font-size:12px}.theme{margin-left:0}.caption{display:block}.tradeoff{margin:16px 0 0;max-width:none}.viewport{margin-top:14px}.app{height:620px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s ease-out}}
</style>
</head>
<body>
<main class="lab">
<header class="lab-head"><div class="grow"><h1>A calmer place to work.</h1><p>Three sidebar directions for Herdr Noodle. Same workspace, different ways to navigate.</p></div></header>
<div class="lab-controls"><nav class="options" aria-label="Sidebar concept"><button data-concept="tree" aria-pressed="true"><small>A</small>Workspace tree</button><button data-concept="rail" aria-pressed="false"><small>B</small>Space rail</button><button data-concept="focus" aria-pressed="false"><small>C</small>Focus sidebar</button></nav><label class="control">Preview width<select id="width"><option value="100%">Fit window</option><option value="1280px">1280 px</option><option value="1024px">1024 px</option></select></label><button class="theme" id="theme" aria-pressed="false"></button></div>
<div class="viewport" aria-label="Scrollable desktop layout preview"><div class="app" id="app"></div></div>
<section class="caption" aria-live="polite"><div><h2 id="concept-title"></h2><p id="concept-description"></p></div><div class="tradeoff"><strong>The tradeoff</strong><p id="concept-tradeoff"></p></div></section>
<p class="demo-label">Interactive HTML study · Fictional spaces and sessions · Try switching spaces, selecting an agent, filtering, and changing appearance. Native implementation would use GPUI.</p>
</main><div class="toast" id="toast" role="status"></div>
<script>
const paths={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',plus:'<path d="M12 5v14M5 12h14"/>',chevron:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m7 10 5 5 5-5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 3 3 3-1 1-3 3-1 1-3-2-2 1-3-3-2-3 1Z"/>',computer:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',agent:'<rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M8 12v2m8-2v2m-7 3h6"/>',branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 7v10m12-10a9 9 0 0 1-9 9H6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',terminal:'<path d="m4 6 6 6-6 6m9 0h7"/>',bell:'<path d="M5 17h14l-2-4V9a5 5 0 0 0-10 0v4Zm5 3h4"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.agent}</svg>`;
const spaces=[{id:'noodle',name:'noodle',initial:'N',branch:'feat/collection-hooks'},{id:'herdr',name:'herdr-noodle',initial:'H',branch:'feat/sidebar'},{id:'mortis',name:'code-mortis',initial:'C',branch:'fix/review-status'},{id:'site',name:'noodle-site',initial:'NS',branch:'main'},{id:'django',name:'django-starter',initial:'D',branch:'main'},{id:'evals',name:'micro1-evals',initial:'M',branch:'main'}];
const agents=[{id:'sidebar',space:'herdr',name:'Refine the sidebar',app:'Codex',status:'working',label:'Working',time:'2m'},{id:'tests',space:'herdr',name:'Review file previews',app:'Claude',status:'idle',label:'Idle',time:'18m'},{id:'hooks',space:'noodle',name:'Collection hooks',app:'Codex',status:'blocked',label:'Needs input',time:'4m'},{id:'reviews',space:'mortis',name:'Review status fix',app:'Claude',status:'done',label:'Finished',time:'6m'}];
const concepts={tree:{title:'Workspace tree',description:'Keep a clear relationship between each space and its agents. Expand only the space you need, with a single attention shortcut for work that needs you elsewhere. The closest evolution of the current sidebar.',tradeoff:'More vertical scrolling with many spaces. Best when you move between several projects.'},rail:{title:'Space rail',description:'Separate switching projects from working inside one. A narrow rail holds spaces; the adjacent list shows agents in the selected space. The All spaces tab gives you a global view without a second permanent list.',tradeoff:'Abbreviated spaces need tooltips. Best when a handful of projects stay open all day.'},focus:{title:'Focus sidebar',description:'Give the current space the whole sidebar. Switch spaces from the named picker, keep agents readable, and surface work that needs you in other spaces. A quieter fit for a terminal-heavy layout.',tradeoff:'Switching spaces takes an extra click. Best for long sessions in one project.'}};
let concept='tree',selectedSpace='herdr',selectedAgent='sidebar',query='',scope='space',collapsed=new Set(),toastTimer;
const $=s=>document.querySelector(s);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function space(){return spaces.find(s=>s.id===selectedSpace)}
function search(){return `<label class="search">${icon('search')}<input id="filter" aria-label="Filter spaces and agents" placeholder="Find a space or agent…" value="${escape(query)}"></label>`}
function agentRows(list){const filtered=list.filter(a=>(a.name+' '+a.app+' '+spaces.find(s=>s.id===a.space).name).toLowerCase().includes(query.toLowerCase()));return filtered.map(a=>`<button class="agent-row" data-agent="${a.id}" aria-current="${selectedAgent===a.id}"><span class="dot ${a.status}" title="${a.label}"></span><span class="grow"><span class="agent-name">${escape(a.name)}</span><span class="agent-meta">${a.app} · ${scope==='all'?spaces.find(s=>s.id===a.space).name:a.time+' ago'}</span></span><span class="status-label ${a.status}">${a.label}</span></button>`).join('')||'<p class="empty">No matching agents in this view.</p>'}
function spaceRow(s){const children=agents.filter(a=>a.space===s.id);return `<button class="space-row" data-space="${s.id}" aria-current="${s.id===selectedSpace}"><span class="avatar">${s.initial}</span><span class="grow space-name">${s.name}</span>${children.some(a=>a.status==='blocked')?'<span class="dot blocked" title="Needs input"></span>':''}<span class="badge">${children.length}</span>${concept==='tree'?icon(collapsed.has(s.id)||s.id!==selectedSpace?'chevron':'down'):''}</button>`}
function attention(){return `<button class="attention" data-agent="hooks"><span class="blocked">${icon('bell')}</span><span class="grow">Needs your input<small>noodle · Collection hooks</small></span><span class="badge">1</span></button>`}
function sidebar(){const head=`<div class="sidebar-head"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="brand grow">Herdr</span><button class="icon" data-action="search" aria-label="Find a space or agent">${icon('search')}</button></div>`;let content='';
if(concept==='tree'){content=`<div class="sidebar-content">${search()}${attention()}<div class="section-label">Spaces<span class="grow"></span><button class="icon" data-demo="Create a space" aria-label="Create a space">${icon('plus')}</button></div>${spaces.filter(s=>s.name.includes(query.toLowerCase())||agents.some(a=>a.space===s.id&&a.name.toLowerCase().includes(query.toLowerCase()))).map(s=>spaceRow(s)+(((s.id===selectedSpace&&!collapsed.has(s.id))||query)?`<div class="nested">${agentRows(agents.filter(a=>a.space===s.id))}</div>`:'')).join('')||'<p class="empty">No matching spaces.</p>'}</div>`}
if(concept==='rail'){content=`<div class="rail-body"><nav class="space-rail" aria-label="Spaces">${spaces.map(s=>`<button data-space="${s.id}" aria-label="Switch to ${s.name}" title="${s.name}" aria-current="${s.id===selectedSpace}"><span class="avatar">${s.initial}</span>${agents.some(a=>a.space===s.id&&a.status==='blocked')?'<span class="dot blocked"></span>':''}</button>`).join('')}<button data-demo="Create a space" title="Create a space" aria-label="Create a space">${icon('plus')}</button></nav><div class="rail-detail"><div class="context-head"><strong>${space().name}</strong><small>${icon('branch')} ${space().branch}</small></div><div class="scope-tabs" aria-label="Agent scope"><button data-scope="space" aria-pressed="${scope==='space'}">This space</button><button data-scope="all" aria-pressed="${scope==='all'}">All spaces</button></div>${search()}<div class="section-label">Agents<span class="grow"></span><span class="badge">${scope==='all'?agents.length:agents.filter(a=>a.space===selectedSpace).length}</span></div>${agentRows(agents.filter(a=>scope==='all'||a.space===selectedSpace))}<button class="new-agent" data-demo="Start an agent">${icon('plus')}Start an agent</button></div></div>`}
if(concept==='focus'){content=`<div class="sidebar-content"><details class="focus-picker"><summary><span class="avatar">${space().initial}</span><span class="grow"><strong>${space().name}</strong><span class="space-meta">This computer</span></span>${icon('down')}</summary><nav class="picker-list" aria-label="Choose a space">${spaces.map(spaceRow).join('')}</nav></details>${search()}<div class="section-label">In this space<span class="grow"></span><span class="badge">${agents.filter(a=>a.space===selectedSpace).length}</span></div>${agentRows(agents.filter(a=>a.space===selectedSpace))}<button class="new-agent" data-demo="Start an agent">${icon('plus')}Start an agent</button><div class="divider"></div><div class="section-label">Elsewhere</div>${selectedSpace!=='noodle'?attention():'<p class="quiet-note">Nothing else needs your attention.</p>'}<p class="quiet-note">One space. A little more room<br>for what you’re working on.</p></div>`}
return `<aside class="sidebar" aria-label="${concepts[concept].title}">${head}${content}<footer class="sidebar-footer">${icon('computer')}This computer<span class="grow"></span><button class="icon footer-settings" data-demo="Settings" aria-label="Settings">${icon('settings')}</button></footer></aside>`}
function work(){const active=agents.find(a=>a.id===selectedAgent),current=active?.space===selectedSpace?active:null;return `<div class="work"><div class="work-tabs"><div class="work-tab">${icon('terminal')}${current?current.name:space().name}</div><span class="muted">${icon('plus')}</span><span class="grow"></span><span>${icon('panel')} Files</span><span>Changes</span></div><div class="work-body"><section class="pane"><div class="pane-head">${icon('agent')}<strong>${current?.app||'Terminal'}</strong><span class="muted grow">~/Projects/${space().name}</span><span class="${current?.status||''}">${current?.label||'Ready'}</span></div><div class="terminal-content"><h2>${current?.name||'Your workspace is ready'}</h2><p class="muted">› Keep the navigation useful, quiet, and out of the way.</p><p>I’m reviewing the shared layout and the relationship between spaces, agents, and the active terminal.</p><div class="output"><span class="check">✓</span> Read the layout and sidebar modules<br><span class="check">✓</span> Preserve the terminal and Git workflow<br><span class="check">✓</span> Keep status visible across spaces</div><p>The sidebar should answer three questions:<br><br><code>Where am I?<br>What is running?<br>Does anything need me?</code></p><p class="muted">${current?.status==='blocked'?'Waiting for your input before continuing.':current?.status==='done'?'Finished. Ready for you to review.':'Working in '+space().name+'…'}</p></div><div class="prompt">Ask ${current?.app||'your agent'} to do anything</div><div class="terminal-model">${current?.app||'Terminal'} · ${space().name} · ${space().branch}</div></section><section class="pane" aria-label="Git changes context"><div class="git-head">${space().name}</div><div class="git-tabs"><span>Changes <span class="badge">3</span></span><span>History</span><span>Graph</span><span>GitHub</span></div><div class="branch">${icon('branch')}<span class="grow">${space().branch}</span>Fetch</div><div class="file-group">Staged changes <span class="badge">1</span></div><div class="file-row"><span class="letter added">A</span>sidebar.js<span class="grow"></span><span class="working">+42</span></div><div class="file-group">Working changes <span class="badge">2</span></div><div class="file-row"><span class="letter">M</span>noodle.json<span class="grow"></span><span class="muted">+8 −4</span></div><div class="file-row"><span class="letter">M</span>RECIPE.md<span class="grow"></span><span class="muted">+6 −2</span></div><div class="git-blank"></div><div class="commit">Commit message…</div><div class="commit-buttons"><button class="demo-control grow" data-demo="Commit staged file">Commit 1 file</button><button class="demo-control" data-demo="Generate commit message">Generate</button></div></section></div><footer class="app-status">${icon('computer')}This computer<span>4 agents</span><span class="grow"></span><span>Codex</span><span class="working">Weekly 32%</span><span>Claude</span><span>Weekly 18%</span></footer></div>`}
function render(){ $('#app').className='app '+concept;$('#app').innerHTML=sidebar()+work();document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.concept===concept));$('#concept-title').textContent=concepts[concept].title;$('#concept-description').textContent=concepts[concept].description;$('#concept-tradeoff').textContent=concepts[concept].tradeoff;}
function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.concept){concept=b.dataset.concept;query='';scope='space';render()}else if(b.dataset.space){const id=b.dataset.space;if(id===selectedSpace&&concept==='tree'){collapsed.has(id)?collapsed.delete(id):collapsed.add(id)}else{selectedSpace=id;selectedAgent=agents.find(a=>a.space===id)?.id||'';collapsed.delete(id)}render()}else if(b.dataset.agent){selectedAgent=b.dataset.agent;selectedSpace=agents.find(a=>a.id===selectedAgent).space;collapsed.delete(selectedSpace);render()}else if(b.dataset.scope){scope=b.dataset.scope;render()}else if(b.dataset.action==='search'){$('#filter').focus()}else if(b.dataset.demo){notify(b.dataset.demo+' · preview only, no Herdr action was run.')}});
document.addEventListener('input',e=>{if(e.target.id==='filter'){const pos=e.target.selectionStart;query=e.target.value;render();$('#filter').focus();$('#filter').setSelectionRange(pos,pos)}});
$('#width').addEventListener('change',e=>{$('#app').style.width=e.target.value});$('#theme').innerHTML=icon('sun')+'Light theme';$('#theme').addEventListener('click',()=>{const light=document.body.classList.toggle('light');$('#theme').setAttribute('aria-pressed',light);$('#theme').innerHTML=icon('sun')+(light?'Dark theme':'Light theme')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const picker=document.querySelector('.focus-picker');if(picker)picker.open=false;if(query){query='';render();$('#filter').focus()}}});render();
</script>
